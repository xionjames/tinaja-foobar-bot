# Settings for Tinaja FooBar Bot. The token is not here: put DISCORD_BOT_TOKEN in .env (see env.sample).
name = "Tinaja FooBar Bot"
prefix = "!"
cogs_dir = "cogs"           # every commands.Cog class in this folder is loaded
context_file = "CONTEXT.md" # the glossary, answered by !glossary [term]

[intents]
message_content = true # read message text: needed for prefix commands and for reading the channel
members = false
presences = false

[replies]
# Plain-text commands, no Python needed. {author} mentions whoever asked, {prefix} is the prefix above.
foo = "bar {author}"
bar = "foo {author}"
# This is the default reply when a user types a command that doesn't exist. You can use {author} to mention the user.
fallback = "I don't know that command, {author}. Try !foo or !bar"

[mentions]
as_prefix = true # "@Bot hello" works the same as "!hello"
reply = "Hi {author}! Try !foo or !bar" # sent whenever the bot is mentioned without a Command
